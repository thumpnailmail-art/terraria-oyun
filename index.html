<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Terraria Sandbox</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family: 'Courier New', monospace; }
  #game { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #hotbar { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:4px; pointer-events:auto; z-index:10; }
  .slot { width:46px; height:46px; background:rgba(20,20,30,0.85); border:2px solid #444; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; position:relative; }
  .slot.active { border-color:#00d4ff; box-shadow:0 0 12px #00d4ff; background:rgba(30,50,80,0.9); }
  .slot .icon { width:26px; height:26px; border-radius:3px; }
  .slot .count { position:absolute; bottom:2px; right:5px; font-size:11px; color:#fff; text-shadow:1px 1px 2px #000; font-weight:bold; }
  .slot .key { position:absolute; top:2px; left:5px; font-size:9px; color:#888; }
  #hearts { position:fixed; top:10px; left:10px; display:flex; gap:3px; }
  .heart { width:22px; height:22px; background:#e33; clip-path:polygon(50% 100%, 0 40%, 0 20%, 20% 0, 50% 20%, 80% 0, 100% 20%, 100% 40%); transition:background 0.2s; }
  .heart.empty { background:#553; }
  #info { position:fixed; top:10px; right:10px; color:#fff; font-size:12px; text-shadow:1px 1px 2px #000; background:rgba(0,0,0,0.5); padding:8px 12px; border-radius:6px; line-height:1.6; }
  #controls { position:fixed; top:10px; left:50%; transform:translateX(-50%); color:#ccc; font-size:11px; text-shadow:1px 1px 2px #000; background:rgba(0,0,0,0.4); padding:4px 10px; border-radius:6px; }
  #craftBtn { position:fixed; bottom:10px; right:10px; background:#00d4ff; color:#000; padding:10px 16px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; pointer-events:auto; font-family:inherit; z-index:10; }
  #craftBtn:hover { background:#4de4ff; }
  #craftPanel { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#16213e; border:2px solid #00d4ff; border-radius:12px; padding:20px; min-width:320px; color:#fff; pointer-events:auto; display:none; z-index:100; box-shadow:0 0 40px rgba(0,212,255,0.4); }
  #craftPanel h3 { color:#00d4ff; margin-bottom:12px; font-family:inherit; }
  .recipe { display:flex; align-items:center; gap:10px; padding:10px; margin:6px 0; background:#0f3460; border-radius:6px; cursor:pointer; transition:background 0.2s; }
  .recipe:hover { background:#1a4a7a; }
  .recipe .give { flex:1; }
  #toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); color:#fff; padding:10px 20px; border-radius:8px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:200; border:1px solid #00d4ff; }
  #touchControls { display:none; }
  @media (max-width:820px) {
    #touchControls { display:block; }
    .tbtn { position:fixed; width:64px; height:64px; background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.3); border-radius:50%; color:#fff; font-size:26px; pointer-events:auto; user-select:none; display:flex; align-items:center; justify-content:center; z-index:20; backdrop-filter:blur(4px); }
    .tbtn:active { background:rgba(0,212,255,0.5); }
    #btnLeft { bottom:110px; left:15px; }
    #btnRight { bottom:110px; left:95px; }
    #btnJump { bottom:110px; right:15px; }
    #hotbar { bottom:6px; gap:2px; }
    .slot { width:38px; height:38px; }
    .slot .icon { width:22px; height:22px; }
    #controls { display:none; }
    #info { font-size:10px; padding:6px 8px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hearts"></div>
  <div id="info"></div>
  <div id="controls">WASD/Ok: Hareket · Sol Tık: Kaz · Sağ Tık: Koy · 1-9/Tekerlek: Slot</div>
</div>
<div id="hotbar"></div>
<button id="craftBtn">🛠️ Üretim</button>
<div id="craftPanel">
  <h3>🛠️ Üretim Menüsü</h3>
  <div id="recipeList"></div>
  <button id="closeCraft" style="margin-top:12px;background:#e33;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit;">Kapat</button>
</div>
<div id="toast"></div>
<div id="touchControls">
  <div class="tbtn" id="btnLeft">◀</div>
  <div class="tbtn" id="btnRight">▶</div>
  <div class="tbtn" id="btnJump">▲</div>
</div>
<script>
'use strict';
(function(){
const WORLD_W = 600, WORLD_H = 180, TILE = 16, SURFACE_Y = 70;
const GRAVITY = 0.42, JUMP_VEL = -8.8, MOVE_SPD = 2.8;
const PLAYER_W = 12, PLAYER_H = 22;
const AIR=0, GRASS=1, DIRT=2, STONE=3, COAL=4, IRON=5, GOLD=6,
      DIAMOND=7, WOOD=8, LEAVES=9, PLANK=10, TORCH=11, TABLE=12;
const TILE_INFO = {
  1:{n:'Çim',c:'#7a4b2a',top:'#5cba3a'},2:{n:'Toprak',c:'#8B4513'},3:{n:'Taş',c:'#6d6d6d'},
  4:{n:'Kömür',c:'#3a3a3a'},5:{n:'Demir',c:'#9a7250'},6:{n:'Altın',c:'#c9a227'},
  7:{n:'Elmas',c:'#4dd0c4'},8:{n:'Odun',c:'#6b3f1a'},9:{n:'Yaprak',c:'#2f7a2f'},
  10:{n:'Tahta',c:'#a86b3a'},11:{n:'Meşale',c:'#ffcc44'},12:{n:'Tezgah',c:'#8B6f3a'}
};
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VW=0, VH=0;
function resize(){ VW=canvas.width=innerWidth; VH=canvas.height=innerHeight; ctx.imageSmoothingEnabled=false; }
resize();
addEventListener('resize', resize);
const seed = Math.floor(Math.random()*99999);
function hash2(x,y,s){
  let h=(x|0)*374761393+(y|0)*668265263+(s|0)*2246822519;
  h=Math.imul(h^(h>>>13),1274126177);
  return ((h^(h>>>16))>>>0)/4294967295;
}
function smooth1(x,s){
  const i=Math.floor(x), f=x-i;
  const a=hash2(i,0,s), b=hash2(i+1,0,s);
  const u=f*f*(3-2*f);
  return a*(1-u)+b*u;
}
function fbm1(x,s,o){ o=o||4;
  let sum=0,amp=1,f=1,t=0;
  for(let i=0;i<o;i++){ sum+=smooth1(x*f,s+i*137)*amp; t+=amp; amp*=0.5; f*=2; }
  return sum/t;
}
function vn2(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s);
  const c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function fbm2(x,y,s,o){ o=o||3;
  let sum=0,amp=1,f=1,t=0;
  for(let i=0;i<o;i++){ sum+=vn2(x*f,y*f,s+i*271)*amp; t+=amp; amp*=0.5; f*=2; }
  return sum/t;
}
let world=[];
function wGet(x,y){
  if(x<0||x>=WORLD_W||y<0||y>=WORLD_H) return STONE;
  return world[y][x];
}
function wSet(x,y,t){
  if(x<0||x>=WORLD_W||y<0||y>=WORLD_H) return;
  world[y][x]=t;
}
function isSolid(t){ return t!==AIR && t!==TORCH; }
function isOre(t){ return t===COAL||t===IRON||t===GOLD||t===DIAMOND; }
function generateWorld(){
  world=[];
  for(let y=0;y<WORLD_H;y++) world[y]=new Uint8Array(WORLD_W);
  const heights=new Int16Array(WORLD_W);
  for(let x=0;x<WORLD_W;x++){
    const h=Math.floor(SURFACE_Y+(fbm1(x*0.02,seed)-0.5)*35);
    heights[x]=Math.max(20,Math.min(WORLD_H-30,h));
  }
  for(let x=0;x<WORLD_W;x++){
    const h=heights[x];
    for(let y=h;y<WORLD_H;y++){
      const depth=y-h;
      let tile=STONE;
      if(depth<1) tile=GRASS;
      else if(depth<4) tile=DIRT;
      if(depth>3){
        const cave=fbm2(x*0.07,y*0.07,seed+500);
        const thr=0.60+Math.min(0.10,depth*0.001);
        if(cave>thr) tile=AIR;
      }
      if(tile===STONE && depth>6){
        const oh=hash2(x,y,seed+7777);
        const df=Math.min(1,depth/80);
        if(oh<0.010) tile=COAL;
        else if(oh<0.022*(1+df)) tile=COAL;
        else if(oh<0.032*(1+df)) tile=IRON;
        else if(oh<0.038*(1+df*2)) tile=GOLD;
        else if(oh<0.040+df*0.008 && depth>60) tile=DIAMOND;
      }
      world[y][x]=tile;
    }
  }
  for(let x=5;x<WORLD_W-5;x++){
    if(hash2(x,42,seed)<0.11){
      const h=heights[x];
      if(world[h][x]===GRASS){ placeTree(x,h-1); x+=3; }
    }
  }
  return heights;
}
function placeTree(x,baseY){
  const trunkH=4+Math.floor(hash2(x,1,seed)*3);
  for(let i=0;i<trunkH;i++){ if(baseY-i>=0) world[baseY-i][x]=WOOD; }
  const topY=baseY-trunkH;
  for(let dy=-2;dy<=1;dy++){
    for(let dx=-2;dx<=2;dx++){
      if(dx===0 && dy<=0 && dy>=-1) continue;
      const lx=x+dx, ly=topY+dy;
      if(lx>=0&&lx<WORLD_W&&ly>=0&&ly<WORLD_H){
        if(world[ly][lx]===AIR){
          if(Math.abs(dx)+Math.abs(dy)<=3 || hash2(lx,ly,seed)<0.7) world[ly][lx]=LEAVES;
        }
      }
    }
  }
}
const player={x:0,y:0,vx:0,vy:0,w:PLAYER_W,h:PLAYER_H,onGround:false,facing:1,hp:10,maxHp:10,invuln:0,animTime:0,mineX:-1,mineY:-1,mineProgress:0};
const inventory=new Array(9).fill(null).map(()=>({tile:0,count:0}));
let selectedSlot=0;
inventory[0]={tile:PLANK,count:80};
inventory[1]={tile:TORCH,count:30};
inventory[2]={tile:TABLE,count:1};
let enemies=[];
let particles=[];
const camera={x:0,y:0};
const keys={};
let touchMoveX=0;
const mouse={x:0,y:0,wx:0,wy:0,left:false,right:false};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='arrowdown'||k==='arrowleft'||k==='arrowright'||k===' '){ e.preventDefault(); }
  if(e.key>='1'&&e.key<='9'){ selectedSlot=parseInt(e.key)-1; updateHotbarUI(); }
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
function updateMouseFromEvent(cx,cy){
  const r=canvas.getBoundingClientRect();
  mouse.x=cx-r.left; mouse.y=cy-r.top;
  mouse.wx=Math.floor((mouse.x+camera.x)/TILE);
  mouse.wy=Math.floor((mouse.y+camera.y)/TILE);
}
canvas.addEventListener('mousemove',e=>updateMouseFromEvent(e.clientX,e.clientY));
canvas.addEventListener('mousedown',e=>{
  if(e.button===0) mouse.left=true;
  if(e.button===2) mouse.right=true;
});
canvas.addEventListener('mouseup',e=>{
  if(e.button===0) mouse.left=false;
  if(e.button===2) mouse.right=false;
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  selectedSlot=(selectedSlot+(e.deltaY>0?1:-1)+9)%9;
  updateHotbarUI();
},{passive:false});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  updateMouseFromEvent(t.clientX,t.clientY);
  mouse.left=true;
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];
  updateMouseFromEvent(t.clientX,t.clientY);
},{passive:false});
canvas.addEventListener('touchend',e=>{ e.preventDefault(); mouse.left=false; },{passive:false});
function setupButtons(){
  const bl=document.getElementById('btnLeft');
  const br=document.getElementById('btnRight');
  const bj=document.getElementById('btnJump');
  const setV=(el,v,key)=>{
    ['touchstart','mousedown'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault(); v();}));
    if(key){
      ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault(); key();}));
    }
  };
  setV(bl,()=>touchMoveX=-1,()=>touchMoveX=0);
  setV(br,()=>touchMoveX=1,()=>touchMoveX=0);
  setV(bj,()=>{ keys[' ']=true; setTimeout(()=>keys[' ']=false,120); });
}
setupButtons();
function updateHotbarUI(){
  const hb=document.getElementById('hotbar');
  if(!hb.dataset.built){
    for(let i=0;i<9;i++){
      const s=document.createElement('div');
      s.className='slot';
      s.innerHTML='<span class="key">'+(i+1)+'</span><div class="icon" style="display:none"></div><span class="count"></span>';
      s.addEventListener('click',()=>{ selectedSlot=i; updateHotbarUI(); });
      hb.appendChild(s);
    }
    hb.dataset.built='1';
  }
  for(let i=0;i<9;i++){
    const s=hb.children[i];
    s.classList.toggle('active',i===selectedSlot);
    const inv=inventory[i];
    const icon=s.querySelector('.icon');
    const cnt=s.querySelector('.count');
    if(inv && inv.count>0 && inv.tile>0){
      const info=TILE_INFO[inv.tile]||{c:'#888'};
      icon.style.background=info.c;
      icon.style.display='block';
      cnt.textContent=inv.count>1?inv.count:'';
    } else {
      icon.style.display='none';
      cnt.textContent='';
    }
  }
}
function updateHeartsUI(){
  const hd=document.getElementById('hearts');
  if(hd.children.length!==player.maxHp){
    hd.innerHTML='';
    for(let i=0;i<player.maxHp;i++){
      const h=document.createElement('div');
      h.className='heart';
      hd.appendChild(h);
    }
  }
  for(let i=0;i<player.maxHp;i++){
    hd.children[i].classList.toggle('empty',i>=player.hp);
  }
}
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.opacity='0',1600);
}
const RECIPES=[
  {result:PLANK,count:4,cost:{[WOOD]:1},name:'4x Tahta'},
  {result:TORCH,count:4,cost:{[WOOD]:1,[COAL]:1},name:'4x Meşale'},
  {result:TABLE,count:1,cost:{[PLANK]:4},name:'1x Çalışma Tezgahı'}
];
function buildCraftUI(){
  const list=document.getElementById('recipeList');
  list.innerHTML='';
  RECIPES.forEach(r=>{
    const row=document.createElement('div');
    row.className='recipe';
    const costStr=Object.entries(r.cost).map(([k,v])=>v+'x '+(TILE_INFO[k]?TILE_INFO[k].n:k)).join(' + ');
    row.innerHTML='<div class="give"><b>'+r.name+'</b><br><small style="color:#aaa;">'+costStr+'</small></div><span style="color:#00d4ff;">▶</span>';
    row.addEventListener('click',()=>{
      if(tryCraft(r)) showToast('✓ Üretildi: '+r.name);
      else showToast('✗ Yetersiz malzeme!');
    });
    list.appendChild(row);
  });
}
buildCraftUI();
document.getElementById('craftBtn').addEventListener('click',()=>{
  const p=document.getElementById('craftPanel');
  p.style.display=p.style.display==='block'?'none':'block';
});
document.getElementById('closeCraft').addEventListener('click',()=>{
  document.getElementById('craftPanel').style.display='none';
});
function countTile(t){ let n=0; for(const s of inventory) if(s.tile===t) n+=s.count; return n; }
function removeTile(t,n){
  for(const s of inventory){
    if(s.tile===t && s.count>0){
      const take=Math.min(s.count,n);
      s.count-=take; n-=take;
      if(s.count<=0) s.tile=0;
      if(n<=0) return true;
    }
  }
  return n<=0;
}
function addTile(t,n){
  for(const s of inventory){
    if(s.tile===t && s.count>0 && s.count<999){
      const add=Math.min(999-s.count,n);
      s.count+=add; n-=add;
      if(n<=0){ updateHotbarUI(); return true; }
    }
  }
  for(const s of inventory){
    if(s.count===0 || s.tile===0){
      s.tile=t;
      const add=Math.min(999,n);
      s.count=add; n-=add;
      if(n<=0){ updateHotbarUI(); return true; }
    }
  }
  updateHotbarUI();
  return n<=0;
}
function tryCraft(r){
  for(const k in r.cost) if(countTile(parseInt(k))<r.cost[k]) return false;
  for(const k in r.cost) removeTile(parseInt(k),r.cost[k]);
  addTile(r.result,r.count);
  return true;
}
let audioCtx=null;
function beep(freq,dur,type,vol){
  type=type||'square'; vol=vol||0.04;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function rectHit(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}
function collideTiles(e){
  e._hitWall=false;
  if(e.vx!==0){
    const nx=e.x+e.vx;
    const dir=e.vx>0?1:-1;
    const edge=dir>0?nx+e.w:nx;
    const tx=Math.floor(edge/TILE);
    const ty1=Math.floor(e.y/TILE);
    const ty2=Math.floor((e.y+e.h-1)/TILE);
    let hit=false;
    for(let ty=ty1;ty<=ty2;ty++){
      if(isSolid(wGet(tx,ty))){ hit=true; break; }
    }
    if(hit){
      e.x=dir>0? tx*TILE-e.w : (tx+1)*TILE;
      e.vx=0; e._hitWall=true;
    } else {
      e.x=nx;
    }
  }
  e.onGround=false;
  if(e.vy!==0){
    const ny=e.y+e.vy;
    const dir=e.vy>0?1:-1;
    const edge=dir>0?ny+e.h:ny;
    const ty=Math.floor(edge/TILE);
    const tx1=Math.floor(e.x/TILE);
    const tx2=Math.floor((e.x+e.w-1)/TILE);
    let hit=false;
    for(let tx=tx1;tx<=tx2;tx++){
      if(isSolid(wGet(tx,ty))){ hit=true; break; }
    }
    if(hit){
      if(dir>0){ e.y=ty*TILE-e.h; e.onGround=true; }
      else { e.y=(ty+1)*TILE; }
      e.vy=0;
    } else {
      e.y=ny;
    }
  }
}
let worldTime=30;
function getDayLight(){
  const t=worldTime%120;
  if(t<5) return t/5;
  if(t<55) return 1;
  if(t<65) return 1-(t-55)/10;
  if(t<115) return 0;
  return (t-115)/5;
}
let spawnTimer=0;
function update(dt){
  worldTime+=dt;
  const moveL = keys['arrowleft']||keys['a']||touchMoveX<0;
  const moveR = keys['arrowright']||keys['d']||touchMoveX>0;
  const jumpK = keys['arrowup']||keys['w']||keys[' '];
  if(moveL){ player.vx-=0.7; player.facing=-1; }
  if(moveR){ player.vx+=0.7; player.facing=1; }
  if(!moveL && !moveR) player.vx*=0.72;
  if(Math.abs(player.vx)>MOVE_SPD) player.vx=MOVE_SPD*Math.sign(player.vx);
  if(Math.abs(player.vx)<0.06) player.vx=0;
  if(jumpK && player.onGround){
    player.vy=JUMP_VEL;
    player.onGround=false;
    beep(300,0.08,'square',0.03);
  }
  player.vy+=GRAVITY;
  if(player.vy>15) player.vy=15;
  collideTiles(player);
  if(player.x<0){ player.x=0; player.vx=0; }
  if(player.x>WORLD_W*TILE-player.w){ player.x=WORLD_W*TILE-player.w; player.vx=0; }
  if(player.y>WORLD_H*TILE){
    player.hp=Math.max(0,player.hp-1);
    player.x=100*TILE; player.y=30*TILE; player.vy=0;
    updateHeartsUI();
  }
  player.animTime+=Math.abs(player.vx)*dt;
  if(player.invuln>0) player.invuln-=dt;
  const tX=player.x+player.w/2-VW/2;
  const tY=player.y+player.h/2-VH/2;
  camera.x+=(tX-camera.x)*0.14;
  camera.y+=(tY-camera.y)*0.14;
  if(camera.y<-60) camera.y=-60;
  if(camera.y>WORLD_H*TILE-VH) camera.y=WORLD_H*TILE-VH;
  if(camera.x<0) camera.x=0;
  if(camera.x>WORLD_W*TILE-VW) camera.x=WORLD_W*TILE-VW;
  mouse.wx=Math.floor((mouse.x+camera.x)/TILE);
  mouse.wy=Math.floor((mouse.y+camera.y)/TILE);
  if(mouse.left && mouse.wx>=0 && mouse.wx<WORLD_W && mouse.wy>=0 && mouse.wy<WORLD_H){
    const t=wGet(mouse.wx,mouse.wy);
    if(t!==AIR){
      const cx=player.x+player.w/2, cy=player.y+player.h/2;
      const tx=mouse.wx*TILE+TILE/2, ty=mouse.wy*TILE+TILE/2;
      const dist=Math.hypot(cx-tx,cy-ty);
      if(dist<TILE*6){
        let hitEnemy=false;
        for(let i=enemies.length-1;i>=0;i--){
          const e=enemies[i];
          const ex=e.x+e.w/2, ey=e.y+e.h/2;
          if(Math.hypot(ex-tx,ey-ty)<TILE*1.5 && Math.hypot(cx-ex,cy-ey)<TILE*5){
            e.hp-=dt*8;
            addParticle(ex,ey,(Math.random()-0.5)*2,-Math.random()*2,'#ff4444',0.4,2);
            if(e.hp<=0){
              for(let k=0;k<8;k++) addParticle(ex,ey,(Math.random()-0.5)*4,(Math.random()-0.5)*4,'#ff6666',0.6,3);
              if(e.type==='zombie') addTile(IRON,1);
              else if(e.type==='slime') addTile(DIRT,1);
              enemies.splice(i,1);
              beep(400,0.1,'square',0.05);
            }
            hitEnemy=true; break;
          }
        }
        if(!hitEnemy){
          if(player.mineX!==mouse.wx || player.mineY!==mouse.wy){
            player.mineX=mouse.wx; player.mineY=mouse.wy; player.mineProgress=0;
          }
          const hardness = t===STONE?1.2 : t===DIRT||t===GRASS?0.5 : t===WOOD||t===LEAVES?0.9 : t===COAL||t===IRON?1.4 : t===GOLD?1.8 : t===DIAMOND?2.5 : 0.7;
          player.mineProgress+=dt/hardness;
          if(player.mineProgress>=0.55){
            breakTile(mouse.wx,mouse.wy,t);
            player.mineProgress=0;
          }
        }
      }
    } else {
      player.mineProgress=0;
    }
  } else {
    player.mineProgress=0;
  }
  if(mouse.right && mouse.wx>=0 && mouse.wx<WORLD_W && mouse.wy>=0 && mouse.wy<WORLD_H){
    if(wGet(mouse.wx,mouse.wy)===AIR){
      const slot=inventory[selectedSlot];
      if(slot && slot.count>0 && slot.tile>0){
        const cx=player.x+player.w/2, cy=player.y+player.h/2;
        const tx=mouse.wx*TILE+TILE/2, ty=mouse.wy*TILE+TILE/2;
        const dist=Math.hypot(cx-tx,cy-ty);
        if(dist<TILE*6){
          const willSolid=isSolid(slot.tile);
          const px=mouse.wx*TILE, py=mouse.wy*TILE;
          if(!(willSolid && rectHit(px,py,TILE,TILE,player.x,player.y,player.w,player.h))){
            wSet(mouse.wx,mouse.wy,slot.tile);
            slot.count--;
            if(slot.count<=0) slot.tile=0;
            updateHotbarUI();
            beep(500,0.05,'triangle',0.02);
            mouse.right=false;
          }
        }
      }
    }
  }
  const dayL=getDayLight();
  spawnTimer+=dt;
  if(dayL<0.3 && spawnTimer>2.5 && enemies.length<18){
    spawnTimer=0;
    const side=Math.random()<0.5?-1:1;
    const spx=player.x+side*(VW/2+60);
    if(spx>20 && spx<WORLD_W*TILE-20){
      for(let ty=0;ty<WORLD_H;ty++){
        if(isSolid(wGet(Math.floor(spx/TILE),ty))){
          const type=Math.random()<0.55?'slime':'zombie';
          spawnEnemy(type,spx,ty*TILE-40);
          break;
        }
      }
    }
  }
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const t=ENEMY_TYPES[e.type];
    const dx=(player.x+player.w/2)-(e.x+e.w/2);
    const dist=Math.abs(dx);
    if(dist<420){
      if(dx<0){ e.vx=-t.speed; e.facing=-1; }
      else { e.vx=t.speed; e.facing=1; }
    } else {
      e.vx*=0.9;
    }
    e.vy+=GRAVITY;
    if(e.vy>12) e.vy=12;
    e.jumpTimer-=dt;
    if(e.onGround && (e._hitWall || (dist<200 && e.jumpTimer<=0 && Math.random()<0.03))){
      e.vy=t.jump;
      e.jumpTimer=0.6;
    }
    collideTiles(e);
    if(player.invuln<=0 && rectHit(player.x,player.y,player.w,player.h,e.x,e.y,e.w,e.h)){
      player.hp=Math.max(0,player.hp-e.damage);
      player.invuln=1.0;
      player.vx=Math.sign(player.x-e.x)*5;
      player.vy=-5;
      beep(150,0.2,'sawtooth',0.07);
      updateHeartsUI();
    }
    if(dayL>0.85 && e.type==='zombie'){
      e.hp-=dt*4;
      if(Math.random()<0.4) addParticle(e.x+e.w/2,e.y,(Math.random()-0.5)*2,-1-Math.random(),'#ff8800',0.4,2);
      if(e.hp<=0){ enemies.splice(i,1); continue; }
    }
    if(dayL>0.95){ enemies.splice(i,1); continue; }
    if(Math.abs(e.x-player.x)>VW*2.5){ enemies.splice(i,1); continue; }
    if(e.y>WORLD_H*TILE){ enemies.splice(i,1); continue; }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18;
    p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
  if(player.hp<=0){
    player.hp=player.maxHp;
    player.x=100*TILE; player.y=30*TILE;
    player.vx=0; player.vy=0;
    enemies.length=0;
    showToast('💀 Öldün! Yeniden doğdun.');
    updateHeartsUI();
  }
}
const ENEMY_TYPES={
  slime:{w:14,h:10,hp:4,speed:0.7,color:'#7bd97b',jump:-5,damage:1},
  zombie:{w:12,h:22,hp:6,speed:1.3,color:'#5a8a5a',jump:-7,damage:1}
};
function spawnEnemy(type,x,y){
  const t=ENEMY_TYPES[type];
  enemies.push({type,x,y,w:t.w,h:t.h,vx:0,vy:0,hp:t.hp,maxHp:t.hp,onGround:false,facing:-1,jumpTimer:0,damage:t.damage});
}
function addParticle(x,y,vx,vy,color,life,size){
  particles.push({x,y,vx,vy,color,life,maxLife:life,size:size||2});
}
function breakTile(x,y,t){
  const info=TILE_INFO[t];
  const col=info?info.c:'#888';
  for(let i=0;i<8;i++){
    addParticle(x*TILE+TILE/2,y*TILE+TILE/2,(Math.random()-0.5)*3.5,(Math.random()-0.5)*3.5-1.2,col,0.5+Math.random()*0.3,2);
  }
  if(t!==LEAVES && t!==GRASS) addTile(t,1);
  else if(t===GRASS) addTile(DIRT,1);
  wSet(x,y,AIR);
  beep(200+Math.random()*80,0.08,'square',0.04);
  if(wGet(x,y-1)===GRASS) wSet(x,y-1,DIRT);
}
function lerpC(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgb(c){ return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'; }
let starField=null;
function getStars(){
  if(!starField){
    starField=[];
    for(let i=0;i<140;i++){
      starField.push({x:hash2(i,1,1),y:hash2(i,2,1),s:hash2(i,3,1)*2+0.5,b:hash2(i,4,1)});
    }
  }
  return starField;
}
function drawBackground(){
  const dl=getDayLight();
  const top=lerpC([8,15,40],[70,140,220],dl);
  const bot=lerpC([20,30,55],[200,225,240],dl);
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,rgb(top));
  g.addColorStop(1,rgb(bot));
  ctx.fillStyle=g;
  ctx.fillRect(0,0,VW,VH);
  if(dl<0.6){
    const alpha=(1-dl*1.66)*0.9;
    if(alpha>0){
      const stars=getStars();
      for(const s of stars){
        let sx=s.x*VW - camera.x*0.05;
        let sy=s.y*VH*0.8 - camera.y*0.05;
        sx=((sx%VW)+VW)%VW;
        if(sy>-5 && sy<VH){
          ctx.fillStyle='rgba(255,255,255,'+(alpha*(0.5+s.b*0.5))+')';
          ctx.fillRect(sx,sy,s.s,s.s);
        }
      }
    }
  }
  const t=(worldTime%120)/120;
  const angle=t*Math.PI*2 - Math.PI/2;
  const r=Math.min(VW,VH)*0.42;
  const cx=VW/2, cy=VH*0.65;
  const sx=cx+Math.cos(angle)*r;
  const sy=cy+Math.sin(angle)*r;
  if(sy<VH+60){
    const isDay=dl>0.5;
    ctx.fillStyle=isDay?'rgba(255,220,100,0.25)':'rgba(200,220,255,0.2)';
    ctx.beginPath();
    ctx.arc(sx,sy,isDay?45:35,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle=isDay?'#ffdd55':'#e8eeff';
    ctx.beginPath();
    ctx.arc(sx,sy,isDay?24:20,0,Math.PI*2);
    ctx.fill();
    if(!isDay){
      ctx.fillStyle='rgba(180,190,210,0.5)';
      ctx.beginPath();
      ctx.arc(sx-6,sy-4,5,0,Math.PI*2);
      ctx.arc(sx+5,sy+3,4,0,Math.PI*2);
      ctx.arc(sx+2,sy-8,3,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.fillStyle=rgb(lerpC([20,35,65],[90,140,90],dl*0.75));
  ctx.beginPath();
  ctx.moveTo(0,VH);
  const ho=-camera.x*0.25;
  const by=VH*0.75;
  for(let x=0;x<=VW;x+=8){
    const wx=x+ho;
    const y=by-(Math.sin(wx*0.008)*40+Math.sin(wx*0.02)*18);
    ctx.lineTo(x,y);
  }
  ctx.lineTo(VW,VH);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle=rgb(lerpC([15,28,55],[70,120,70],dl*0.85));
  ctx.beginPath();
  ctx.moveTo(0,VH);
  const ho2=-camera.x*0.45;
  const by2=VH*0.85;
  for(let x=0;x<=VW;x+=8){
    const wx=x+ho2;
    const y=by2-(Math.sin(wx*0.012+5)*28+Math.sin(wx*0.03+1)*14);
    ctx.lineTo(x,y);
  }
  ctx.lineTo(VW,VH);
  ctx.closePath();
  ctx.fill();
}
function drawWorld(){
  const x0=Math.max(0,Math.floor(camera.x/TILE)-1);
  const x1=Math.min(WORLD_W-1,Math.ceil((camera.x+VW)/TILE)+1);
  const y0=Math.max(0,Math.floor(camera.y/TILE)-1);
  const y1=Math.min(WORLD_H-1,Math.ceil((camera.y+VH)/TILE)+1);
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const t=world[y][x];
      if(t===AIR) continue;
      const sx=Math.floor(x*TILE-camera.x);
      const sy=Math.floor(y*TILE-camera.y);
      if(t===TORCH){
        ctx.fillStyle='#6b3f1a';
        ctx.fillRect(sx+6,sy+5,4,11);
        const fl=0.85+Math.random()*0.3;
        ctx.fillStyle='rgba(255,150,0,0.5)';
        ctx.beginPath(); ctx.arc(sx+8,sy+5,7*fl,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ffaa22';
        ctx.beginPath(); ctx.arc(sx+8,sy+5,4*fl,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ffee55';
        ctx.beginPath(); ctx.arc(sx+8,sy+4,2*fl,0,Math.PI*2); ctx.fill();
        continue;
      }
      const info=TILE_INFO[t];
      ctx.fillStyle=info.c;
      ctx.fillRect(sx,sy,TILE,TILE);
      if(t===GRASS){
        ctx.fillStyle=info.top;
        ctx.fillRect(sx,sy,TILE,4);
        ctx.fillStyle='rgba(0,0,0,0.15)';
        for(let i=0;i<3;i++){
          const px=sx+(hash2(x,y,i)*12)|0;
          ctx.fillRect(px,sy+4,2,3);
        }
      } else if(t===LEAVES){
        ctx.fillStyle='rgba(0,0,0,0.18)';
        for(let i=0;i<5;i++){
          const px=sx+(hash2(x,y,i)*TILE)|0;
          const py=sy+(hash2(x,y,i+10)*TILE)|0;
          ctx.fillRect(px,py,3,3);
        }
        ctx.fillStyle='rgba(255,255,255,0.06)';
        for(let i=0;i<3;i++){
          const px=sx+(hash2(x,y,i+20)*TILE)|0;
          const py=sy+(hash2(x,y,i+30)*TILE)|0;
          ctx.fillRect(px,py,2,2);
        }
      } else if(t===WOOD){
        ctx.fillStyle='rgba(0,0,0,0.2)';
        ctx.fillRect(sx+4,sy,1,TILE);
        ctx.fillRect(sx+10,sy,1,TILE);
      } else if(t===COAL||t===IRON||t===GOLD||t===DIAMOND){
        const spot=t===COAL?'#0a0a0a':t===IRON?'#c89878':t===GOLD?'#ffe080':'#a8f0e8';
        ctx.fillStyle=spot;
        for(let i=0;i<4;i++){
          const px=sx+2+(hash2(x,y,i)*11)|0;
          const py=sy+2+(hash2(x,y,i+5)*11)|0;
          ctx.fillRect(px,py,3,3);
        }
      } else if(t===STONE||t===DIRT){
        ctx.fillStyle='rgba(0,0,0,0.08)';
        for(let i=0;i<4;i++){
          const px=sx+(hash2(x,y,i)*14)|0;
          const py=sy+(hash2(x,y,i+7)*14)|0;
          ctx.fillRect(px,py,2,2);
        }
      } else if(t===PLANK){
        ctx.fillStyle='rgba(0,0,0,0.2)';
        ctx.fillRect(sx,sy+7,TILE,1);
        ctx.fillRect(sx+7,sy,1,8);
        ctx.fillRect(sx+3,sy+8,1,8);
      } else if(t===TABLE){
        ctx.fillStyle='#5a3a1a';
        ctx.fillRect(sx+1,sy+9,TILE-2,2);
        ctx.fillRect(sx+2,sy+11,2,5);
        ctx.fillRect(sx+TILE-4,sy+11,2,5);
        ctx.fillStyle='#a87a3a';
        ctx.fillRect(sx,sy+7,TILE,3);
      }
    }
  }
  if(player.mineProgress>0 && player.mineX>=0){
    const sx=player.mineX*TILE-camera.x;
    const sy=player.mineY*TILE-camera.y;
    const p=Math.min(1,player.mineProgress/0.55);
    ctx.strokeStyle='rgba(0,0,0,'+(p*0.9)+')';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    const cx=sx+TILE/2, cy=sy+TILE/2;
    ctx.moveTo(cx-6*p,cy-6*p); ctx.lineTo(cx+6*p,cy+6*p);
    ctx.moveTo(cx+6*p,cy-6*p); ctx.lineTo(cx-6*p,cy+6*p);
    ctx.moveTo(cx,cy-7*p); ctx.lineTo(cx-3*p,cy);
    ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(sx,sy-8,TILE,4);
    ctx.fillStyle='#00d4ff';
    ctx.fillRect(sx+1,sy-7,(TILE-2)*p,2);
  }
  if(mouse.wx>=0 && mouse.wx<WORLD_W && mouse.wy>=0 && mouse.wy<WORLD_H){
    const cx=player.x+player.w/2, cy=player.y+player.h/2;
    const tx=mouse.wx*TILE+TILE/2, ty=mouse.wy*TILE+TILE/2;
    if(Math.hypot(cx-tx,cy-ty)<TILE*6){
      ctx.strokeStyle='rgba(255,255,255,0.6)';
      ctx.lineWidth=1;
      ctx.strokeRect(mouse.wx*TILE-camera.x+0.5,mouse.wy*TILE-camera.y+0.5,TILE-1,TILE-1);
    }
  }
}
function drawPlayer(){
  if(player.invuln>0 && Math.floor(player.invuln*22)%2===0) return;
  const sx=Math.floor(player.x-camera.x);
  const sy=Math.floor(player.y-camera.y);
  const walk=Math.abs(player.vx)>0.2?Math.sin(player.animTime*3.5):0;
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(sx+player.w/2,sy+player.h+1,player.w/2,2.5,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#1a3a7a';
  ctx.fillRect(sx+1,sy+player.h-6+walk*2,4,6);
  ctx.fillRect(sx+player.w-5,sy+player.h-6-walk*2,4,6);
  ctx.fillStyle='#2266cc';
  ctx.fillRect(sx,sy+5,player.w,player.h-11);
  ctx.fillStyle='#0d1a33';
  ctx.fillRect(sx,sy+player.h-7,player.w,2);
  ctx.fillStyle='#f0c090';
  ctx.fillRect(sx,sy-2,player.w,8);
  ctx.fillStyle='#4a2208';
  ctx.fillRect(sx-1,sy-3,player.w+2,3);
  ctx.fillRect(sx+(player.facing>0?player.w-2:0),sy,2,4);
  ctx.fillStyle='#000';
  const ex=player.facing>0?sx+6:sx+3;
  ctx.fillRect(ex,sy+1,2,3);
  ctx.fillRect(ex+4,sy+1,2,3);
  ctx.fillStyle='#f0c090';
  const ax=player.facing>0?sx+player.w-3:sx-1;
  ctx.fillRect(ax,sy+7,4,8);
  ctx.strokeStyle='#8a6a3a';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(ax+2,sy+7);
  ctx.lineTo(ax+2+player.facing*8,sy+2);
  ctx.stroke();
  ctx.strokeStyle='#aaa';
  ctx.beginPath();
  ctx.moveTo(ax+2+player.facing*6,sy-2);
  ctx.lineTo(ax+2+player.facing*10,sy+4);
  ctx.stroke();
}
function drawEnemies(){
  for(const e of enemies){
    const sx=Math.floor(e.x-camera.x);
    const sy=Math.floor(e.y-camera.y);
    if(sx<-60||sx>VW+60||sy<-60||sy>VH+60) continue;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(sx+e.w/2,sy+e.h+1,e.w/2,2.5,0,0,Math.PI*2);
    ctx.fill();
    if(e.type==='slime'){
      const squash=e.onGround?1:0.82;
      const grad=ctx.createRadialGradient(sx+e.w/2,sy+e.h-3,1,sx+e.w/2,sy+e.h/2,e.w/2);
      grad.addColorStop(0,'#9df09d');
      grad.addColorStop(1,'#4a9a4a');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.ellipse(sx+e.w/2,sy+e.h-e.h*squash/2,e.w/2,e.h*squash/2,0,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#000';
      ctx.fillRect(sx+3,sy+3,2,2);
      ctx.fillRect(sx+e.w-5,sy+3,2,2);
      ctx.fillStyle='#fff';
      ctx.fillRect(sx+3,sy+1,3,2);
    } else {
      const walk=Math.abs(e.vx)>0.1?Math.sin(performance.now()*0.01):0;
      ctx.fillStyle='#1a3a1a';
      ctx.fillRect(sx+1,sy+e.h-6+walk*2,4,6);
      ctx.fillRect(sx+e.w-5,sy+e.h-6-walk*2,4,6);
      ctx.fillStyle='#3a6a3a';
      ctx.fillRect(sx,sy+5,e.w,e.h-11);
      ctx.fillStyle='#8fc08f';
      ctx.fillRect(sx+(e.facing>0?e.w:-3),sy+7,3,9);
      ctx.fillStyle='#8fc08f';
      ctx.fillRect(sx,sy-3,e.w,8);
      ctx.fillStyle='#f00';
      const ex=e.facing>0?sx+6:sx+3;
      ctx.fillRect(ex,sy,2,2);
      ctx.fillRect(ex+4,sy,2,2);
    }
    if(e.hp<e.maxHp){
      ctx.fillStyle='rgba(0,0,0,0.7)';
      ctx.fillRect(sx,sy-6,e.w,3);
      ctx.fillStyle='#e33';
      ctx.fillRect(sx,sy-6,e.w*(e.hp/e.maxHp),3);
    }
  }
}
function drawParticles(){
  for(const p of particles){
    const a=p.life/p.maxLife;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-camera.x|0,p.y-camera.y|0,p.size,p.size);
  }
  ctx.globalAlpha=1;
}
function drawLighting(){
  const dl=getDayLight();
  if(dl<0.92){
    const darkness=(1-dl)*0.72;
    ctx.fillStyle='rgba(5,10,30,'+darkness+')';
    ctx.fillRect(0,0,VW,VH);
  }
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const x0=Math.max(0,Math.floor(camera.x/TILE)-5);
  const x1=Math.min(WORLD_W-1,Math.ceil((camera.x+VW)/TILE)+5);
  const y0=Math.max(0,Math.floor(camera.y/TILE)-5);
  const y1=Math.min(WORLD_H-1,Math.ceil((camera.y+VH)/TILE)+5);
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      if(world[y][x]===TORCH){
        const sx=x*TILE+TILE/2-camera.x;
        const sy=y*TILE+TILE/2-camera.y;
        const fl=0.9+Math.random()*0.2;
        const r=100*fl;
        const g=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
        g.addColorStop(0,'rgba(255,200,100,0.6)');
        g.addColorStop(0.5,'rgba(255,140,40,0.25)');
        g.addColorStop(1,'rgba(255,80,0,0)');
        ctx.fillStyle=g;
        ctx.fillRect(sx-r,sy-r,r*2,r*2);
      }
    }
  }
  const psx=player.x+player.w/2-camera.x;
  const psy=player.y+player.h/2-camera.y;
  const pg=ctx.createRadialGradient(psx,psy,0,psx,psy,80);
  pg.addColorStop(0,'rgba(180,210,255,0.2)');
  pg.addColorStop(1,'rgba(180,210,255,0)');
  ctx.fillStyle=pg;
  ctx.fillRect(psx-80,psy-80,160,160);
  ctx.restore();
}
function render(){
  drawBackground();
  drawWorld();
  drawEnemies();
  drawPlayer();
  drawParticles();
  drawLighting();
  const vg=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.35,VW/2,VH/2,Math.max(VW,VH)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,VW,VH);
  if(mouse.x>0&&mouse.y>0){
    ctx.strokeStyle='rgba(255,255,255,0.7)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(mouse.x-7,mouse.y); ctx.lineTo(mouse.x-3,mouse.y);
    ctx.moveTo(mouse.x+3,mouse.y); ctx.lineTo(mouse.x+7,mouse.y);
    ctx.moveTo(mouse.x,mouse.y-7); ctx.lineTo(mouse.x,mouse.y-3);
    ctx.moveTo(mouse.x,mouse.y+3); ctx.lineTo(mouse.x,mouse.y+7);
    ctx.stroke();
  }
  const t=worldTime%120;
  const hour=Math.floor((t/120)*24+6)%24;
  const min=Math.floor(((t/120)*24*60)%60);
  const timeStr=String(hour).padStart(2,'0')+':'+String(min).padStart(2,'0');
  const isNight=getDayLight()<0.4;
  document.getElementById('info').innerHTML=
    (isNight?'🌙':'☀️')+' '+timeStr+
    '<br>📍 '+Math.floor(player.x/TILE)+','+Math.floor(player.y/TILE)+
    '<br>👾 '+enemies.length;
}
function init(){
  generateWorld();
  for(let y=0;y<WORLD_H;y++){
    if(isSolid(wGet(50,y))){
      player.x=50*TILE;
      player.y=(y-2)*TILE;
      break;
    }
  }
  camera.x=player.x-VW/2;
  camera.y=player.y-VH/2;
  updateHeartsUI();
  updateHotbarUI();
}
let lastT=performance.now();
function loop(now){
  let dt=(now-lastT)/1000;
  lastT=now;
  if(dt>0.1) dt=0.1;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
