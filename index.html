<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Terraria Sandbox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="stats">
    <div class="bar">
      <span class="icon">❤️</span>
      <div class="track"><div class="fill hpFill" id="hpFill"></div></div>
      <span class="txt" id="hpTxt">100/100</span>
    </div>
    <div class="bar">
      <span class="icon">✨</span>
      <div class="track"><div class="fill mpFill" id="mpFill"></div></div>
      <span class="txt" id="mpTxt">50/50</span>
    </div>
  </div>
  <div id="info"></div>
</div>

<div id="bossBar">
  <div class="fill" id="bossFill"></div>
  <div class="name" id="bossName">EYE OF CTHULHU</div>
</div>

<div id="hotbar"></div>
<div id="controls">WASD: Hareket · Sol Tık: Kaz/Saldır · Sağ Tık: Koy/Kullan · 1-9/Tekerlek · C: Üret</div>

<button id="craftBtn">🛠️ Üretim</button>
<button id="saveBtn">💾 Kaydet</button>

<div id="tooltip"></div>

<div id="craftPanel">
  <h3>🛠️ Üretim Menüsü</h3>
  <div id="recipeList"></div>
  <button class="closeBtn" id="closeCraft">Kapat</button>
</div>

<div id="chestPanel">
  <h3>📦 Sandık</h3>
  <div id="chestGrid"></div>
  <div class="hint">Envanterinden eşya koymak için aşağıdaki slotlara tıkla:</div>
  <div id="invGrid"></div>
  <button class="closeBtn" id="closeChest">Kapat</button>
</div>

<div id="toast"></div>

<div id="touchControls">
  <div class="tbtn" id="btnLeft">◀</div>
  <div class="tbtn" id="btnRight">▶</div>
  <div class="tbtn" id="btnJump">▲</div>
  <div class="tbtn" id="btnUse">⛏️</div>
</div>

<script src="game.js"></script>
</body>
</html>
