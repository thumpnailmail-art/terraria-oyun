<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Çiftlik Hayatı</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="topBar">
    <div class="stat"><span class="ic">💰</span><span id="moneyTxt">500g</span></div>
    <div class="stat"><span class="ic">⚡</span><div class="bar"><div id="energyFill" class="fill"></div></div><span id="energyTxt">100/100</span></div>
    <div class="stat"><span class="ic">🕐</span><span id="clockTxt">6:00</span></div>
    <div class="stat"><span class="ic">📅</span><span id="dayTxt">Gün 1</span></div>
  </div>
  <div id="hotbar"></div>
  <div id="hint">Sol tık: Alet kullan · E: Etkileşim · 1-6: Slot</div>
</div>

<div id="shopPanel">
  <div class="shopHeader">
    <h2>🏪 Pierre'in Dükkanı</h2>
    <button class="closeBtn" id="closeShop">✖</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="buy">Al</button>
    <button class="tab" data-tab="sell">Sat</button>
  </div>
  <div id="shopContent"></div>
</div>

<div id="bedPanel">
  <div class="bedBox">
    <h2>🛏️ Uyumak ister misin?</h2>
    <p id="bedDayInfo">Yarın yeni bir gün başlayacak.</p>
    <div class="bedButtons">
      <button id="sleepYes" class="yes">Evet, uyu</button>
      <button id="sleepNo" class="no">Hayır</button>
    </div>
  </div>
</div>

<div id="dialogBox">
  <div class="dlgPortrait">🧑‍🌾</div>
  <div class="dlgText" id="dlgText"></div>
</div>

<div id="toast"></div>

<div id="touch">
  <div class="tbtn" id="tbUp">▲</div>
  <div class="tbtn" id="tbDown">▼</div>
  <div class="tbtn" id="tbLeft">◀</div>
  <div class="tbtn" id="tbRight">▶</div>
  <div class="tbtn" id="tbAct">⛏️</div>
  <div class="tbtn" id="tbE">E</div>
</div>

<script src="game.js"></script>
</body>
</html>
